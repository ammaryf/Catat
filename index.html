<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Kantong</title>
<style>
:root{--bg:#000;--card:#101010;--card2:#1b1b1b;--line:#242424;--tx:#ececec;--mut:#8b8b8b;--ok:#4ade80;--bad:#f87171;--acc:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
#app{padding:16px 16px calc(150px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 8px}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em}
.mut{color:var(--mut)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.k b{display:block;font-size:17px;margin-top:2px}
details summary{color:var(--mut);padding:10px 0;cursor:pointer}
.bar{height:6px;border-radius:3px;background:var(--card2);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh{font-size:12px;color:var(--mut);margin:16px 0 0;text-transform:uppercase;letter-spacing:.05em}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{flex:1;background:none;border:0;color:var(--mut);padding:14px 0;font-size:13px}
.nav button.on{color:var(--tx);font-weight:600}
.fabs{position:fixed;right:16px;bottom:calc(68px + env(safe-area-inset-bottom));display:flex;gap:12px;z-index:5}
.fab{width:56px;height:56px;border-radius:28px;border:0;font-size:26px;display:grid;place-items:center}
.fab.p{background:var(--ok);color:#000;font-weight:700}
.fab.m{background:var(--card2);border:1px solid var(--line);font-size:22px}
.ov{position:fixed;inset:0;background:#000;z-index:10;overflow:auto;padding:16px 16px 40px}
.ov>div{max-width:560px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hd b{font-size:18px}
.x{background:none;border:0;font-size:26px;color:var(--mut);padding:4px 10px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:12px 0}
.seg button{flex:1;background:none;border:0;padding:10px 0;border-radius:9px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--tx);font-weight:600}
.lbl{font-size:12px;color:var(--mut);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;outline:none}
.in:focus{border-color:#3a3a3a}
.nom{font-size:30px;font-weight:700;padding:12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px;color:var(--tx)}
.chip.on{background:var(--ok);border-color:var(--ok);color:#000;font-weight:600}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;background:var(--ok);color:#000;margin-top:22px}
.btn.g{background:var(--card2);color:var(--tx);font-weight:500;margin-top:10px;border:1px solid var(--line)}
.btn.d{background:none;color:var(--bad);border:1px solid #3a1c1c}
.mic{width:100%;background:var(--card);border:1px dashed #333;border-radius:14px;padding:13px;display:flex;gap:10px;align-items:center;justify-content:center}
.mic.rec{border-color:var(--bad);color:var(--bad)}
.heard{font-size:13px;color:var(--mut);margin-top:6px;min-height:18px}
.mn{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.mn button{background:var(--card);border:1px solid var(--line);border-radius:10px;width:44px;height:40px;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:#222;border:1px solid #333;padding:10px 16px;border-radius:12px;z-index:20;max-width:90%;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>

<div class="fabs" id="fabs">
  <button class="fab m" id="fabMic" aria-label="Input suara">🎙</button>
  <button class="fab p" id="fabAdd" aria-label="Tambah">+</button>
</div>
<nav class="nav" id="nav">
  <button data-v="home">Beranda</button>
  <button data-v="list">Riwayat</button>
  <button data-v="set">Pengaturan</button>
</nav>

<!-- form transaksi -->
<div class="ov" id="sheet" hidden><div>
  <div class="hd"><b id="shTitle">Catat</b><button class="x" id="shX">×</button></div>
  <button class="mic" id="mic">🎙 <span>Ucapkan transaksi</span></button>
  <div class="heard" id="heard"></div>
  <div class="seg" id="seg">
    <button data-t="keluar">Keluar</button><button data-t="masuk">Masuk</button><button data-t="transfer">Transfer</button>
  </div>
  <input class="in nom" id="nom" inputmode="numeric" placeholder="0" autocomplete="off">
  <div class="lbl" id="lblK">Bayar pakai</div>
  <div class="chips" id="chK"></div>
  <div id="rowT" hidden><div class="lbl">Ke kantong</div><div class="chips" id="chT"></div></div>
  <div id="rowC"><div class="lbl">Kategori</div><div class="chips" id="chC"></div></div>
  <div class="lbl">Catatan</div>
  <input class="in" id="cat" placeholder="mis. makan siang" autocomplete="off">
  <div class="lbl">Tanggal</div>
  <input class="in" id="tgl" type="date" style="color-scheme:dark">
  <button class="btn" id="save">Simpan</button>
  <button class="btn d" id="del" hidden>Hapus</button>
</div></div>

<!-- pengaturan -->
<div class="ov" id="set" hidden><div>
  <div class="hd"><b>Pengaturan</b><button class="x" id="setX">×</button></div>
  <div class="lbl">URL Apps Script (…/exec)</div>
  <input class="in" id="sUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
  <div class="lbl">PIN</div>
  <input class="in" id="sPin" type="password" autocomplete="off">
  <div class="lbl">Nama kamu (muncul di riwayat)</div>
  <input class="in" id="sNama" placeholder="mis. Aku / Istri" autocomplete="off">
  <button class="btn" id="sSave">Simpan &amp; sinkron</button>
  <button class="btn g" id="sLink">Salin link untuk istri</button>
  <p class="mut" style="font-size:13px;margin-top:18px">Kantong, saldo awal, kategori, dan aturan kata kunci diedit langsung di Google Sheet (tab Kantong, Kategori, Aturan).</p>
</div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp '+Math.abs(Math.round(n)).toLocaleString('id-ID');
const todayStr=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

let cfg=jget('cfg',{});
let S=jget('cache',{kantong:[],kategori:[],aturan:[],tx:[]});
let Q=jget('queue',[]);
let view='home', month=todayStr().slice(0,7), F={};

// link undangan: #c=base64({u,p})
if(location.hash.startsWith('#c=')){
  try{const o=JSON.parse(atob(location.hash.slice(3)));cfg.url=o.u;cfg.pin=o.p;jset('cfg',cfg)}catch{}
  history.replaceState(null,'',location.pathname);
}

/* ---------- parser nominal (bahasa Indonesia) ---------- */
//#parse-start
function parseAmount(s){
  s=String(s).toLowerCase();
  s=s.replace(/rp\.?/g,' ');
  s=s.replace(/\bse(ribu|ratus|juta)\b/g,'satu $1');
  s=s.replace(/\bsebelas\b/g,'sepuluh satu');
  s=s.replace(/(\d)\s*(rb|k)\b/g,'$1 ribu').replace(/(\d)\s*jt\b/g,'$1 juta');
  while(/(\d)\.(\d{3})(?!\d)/.test(s)) s=s.replace(/(\d)\.(\d{3})(?!\d)/g,'$1$2');
  s=s.replace(/(\d),(\d{1,2})(?!\d)/g,'$1.$2');
  const W={nol:0,satu:1,dua:2,tiga:3,empat:4,lima:5,enam:6,tujuh:7,delapan:8,sembilan:9,sepuluh:10};
  let total=0,cur=0,last=0,found=false;
  for(const t of s.split(/\s+/)){
    if(/^\d+(\.\d+)?$/.test(t)){cur+=parseFloat(t);last=0;found=true}
    else if(t in W){cur+=W[t];last=W[t];found=true}
    else if(t==='belas'){cur+=10;last=0;found=true}
    else if(t==='puluh'){cur=cur-last+last*10;last=0;found=true}
    else if(t==='ratus'){cur=cur-last+last*100;last=0;found=true}
    else if(t==='ribu'){total+=(cur||1)*1000;cur=0;last=0;found=true}
    else if(t==='juta'){total+=(cur||1)*1e6;cur=0;last=0;found=true}
  }
  return found?Math.round(total+cur):0;
}
//#parse-end

/* ---------- data ---------- */
const persistQ=()=>jset('queue',Q);
function applyQ(tx){
  for(const op of Q){
    if(op.action==='add'){if(!tx.find(t=>t.id===op.tx.id))tx.push(op.tx)}
    else if(op.action==='update'){const i=tx.findIndex(t=>t.id===op.tx.id);if(i>=0)tx[i]=op.tx;else tx.push(op.tx)}
    else if(op.action==='delete'){tx=tx.filter(t=>t.id!==op.id)}
  }
  return tx;
}
const T=()=>applyQ(S.tx.slice()).sort((a,b)=>String(b.tanggal).localeCompare(String(a.tanggal))||String(b.id).localeCompare(String(a.id)));

async function api(method,body){
  const r=method==='GET'
    ?await fetch(cfg.url+'?pin='+encodeURIComponent(cfg.pin))
    :await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pin:cfg.pin,...body})});
  const j=await r.json();
  if(j.error)throw new Error(j.error);
  return j;
}
async function load(){
  if(!cfg.url){openSet();return}
  try{S=await api('GET');jset('cache',S);render()}
  catch(e){toast('Gagal sinkron: '+e.message)}
}
let flushing=false;
async function flush(){
  if(flushing||!Q.length||!cfg.url)return;
  flushing=true;
  try{while(Q.length){await api('POST',Q[0]);Q.shift();persistQ()}}
  catch(e){toast('Belum tersinkron, dicoba lagi nanti')}
  flushing=false;
  if(!Q.length)load();
}
function enqueue(op){Q.push(op);persistQ();render();flush()}

/* ---------- helper tampilan ---------- */
let toastT;
function toast(m){
  let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)}
  el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600);
}
function saldoMap(tx){
  const m={};S.kantong.forEach(k=>m[k.nama]=Number(k.saldo_awal)||0);
  tx.forEach(t=>{
    const n=+t.nominal||0;
    if(t.tipe==='masuk')m[t.kantong]=(m[t.kantong]||0)+n;
    else if(t.tipe==='keluar')m[t.kantong]=(m[t.kantong]||0)-n;
    else{m[t.kantong]=(m[t.kantong]||0)-n;m[t.tujuan]=(m[t.tujuan]||0)+n}
  });
  return m;
}
function usage(tx){
  const lim=new Date(Date.now()-60*864e5).toISOString().slice(0,10),u={};
  tx.forEach(t=>{if(String(t.tanggal)>=lim){u[t.kantong]=(u[t.kantong]||0)+1;if(t.tujuan)u[t.tujuan]=(u[t.tujuan]||0)+1}});
  return u;
}
function kOrder(tx){
  const u=usage(tx);
  return S.kantong.map((k,i)=>({n:k.nama,i})).sort((a,b)=>(u[b.n]||0)-(u[a.n]||0)||a.i-b.i).map(x=>x.n);
}
function monthLabel(m){return new Date(m+'-01T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'})}
function shiftMonth(m,d){const [y,mo]=m.split('-').map(Number);const x=new Date(y,mo-1+d,1);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}
function dayLabel(d){return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})}
function sumMonth(tx,m){
  let masuk=0,keluar=0;const kat={};
  tx.forEach(t=>{if(String(t.tanggal).slice(0,7)!==m)return;const n=+t.nominal||0;
    if(t.tipe==='masuk')masuk+=n;else if(t.tipe==='keluar'){keluar+=n;kat[t.kategori]=(kat[t.kategori]||0)+n}});
  return {masuk,keluar,kat};
}
function rowHTML(t){
  const tr=t.tipe==='transfer';
  const sub=tr?`${esc(t.kantong)} → ${esc(t.tujuan)}`:`${esc(t.kategori)} · ${esc(t.kantong)}`;
  const who=t.oleh?` · ${esc(t.oleh)}`:'';
  const cls=t.tipe==='masuk'?'ok':tr?'mut':'';
  const sign=t.tipe==='masuk'?'+':tr?'':'-';
  return `<div class="item" data-id="${esc(t.id)}"><div class="grow"><div class="t">${esc(t.catatan||(tr?'Transfer':t.kategori))}</div><div class="s">${sub}${who}</div></div><div class="${cls}" style="font-weight:600">${sign}${rp(+t.nominal).replace('-','')}</div></div>`;
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const tx=T();
  if(view==='home')$('#app').innerHTML=homeHTML(tx);
  else if(view==='list')$('#app').innerHTML=listHTML(tx);
}
function homeHTML(tx){
  const m=todayStr().slice(0,7),sm=sumMonth(tx,m),sal=saldoMap(tx),u=usage(tx);
  const total=Object.values(sal).reduce((a,b)=>a+b,0);
  const ord=kOrder(tx);
  const act=ord.filter(n=>u[n]||Math.round(sal[n]||0)!==0),rest=ord.filter(n=>!act.includes(n));
  const card=n=>`<div class="k"><span class="mut" style="font-size:13px">${esc(n)}</span><b class="${(sal[n]||0)<0?'bad':''}">${rp(sal[n]||0)}</b></div>`;
  const kats=Object.entries(sm.kat).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=kats[0]?kats[0][1]:1;
  return `
  <div class="mut" style="font-size:13px">Total saldo</div>
  <div class="big ${total<0?'bad':''}">${rp(total)}</div>
  <div class="row" style="margin-top:8px"><span class="ok">↓ ${rp(sm.masuk)}</span><span class="bad">↑ ${rp(sm.keluar)}</span><span class="mut" style="font-size:12px">${monthLabel(m)}</span></div>
  <h1>Kantong</h1>
  <div class="grid">${act.map(card).join('')||'<div class="mut">Belum ada kantong. Isi tab Kantong di Sheet.</div>'}</div>
  ${rest.length?`<details><summary>Kantong jarang dipakai (${rest.length})</summary><div class="grid">${rest.map(card).join('')}</div></details>`:''}
  <h1>Pengeluaran per kategori</h1>
  <div class="card">${kats.length?kats.map(([k,v])=>`<div style="margin-bottom:10px"><div class="row"><span class="grow">${esc(k)}</span><span>${rp(v)}</span></div><div class="bar"><i style="width:${Math.max(4,v/mx*100)}%"></i></div></div>`).join('').replace(/margin-bottom:10px(?![\s\S]*margin-bottom:10px)/,'margin-bottom:0'):'<span class="mut">Belum ada pengeluaran bulan ini.</span>'}</div>
  <h1>Terbaru</h1>
  <div>${tx.slice(0,5).map(rowHTML).join('')||'<div class="mut">Belum ada transaksi.</div>'}</div>`;
}
function listHTML(tx){
  const sm=sumMonth(tx,month),list=tx.filter(t=>String(t.tanggal).slice(0,7)===month);
  let html=`<div class="mn"><button data-m="-1">‹</button><b>${monthLabel(month)}</b><button data-m="1">›</button></div>
  <div class="row mut" style="margin:10px 0;font-size:14px"><span class="ok">↓ ${rp(sm.masuk)}</span><span class="bad">↑ ${rp(sm.keluar)}</span></div>`;
  let d='';
  list.forEach(t=>{if(t.tanggal!==d){d=t.tanggal;html+=`<div class="dh">${dayLabel(d)}</div>`}html+=rowHTML(t)});
  return html+(list.length?'':'<div class="mut" style="margin-top:20px">Tidak ada transaksi.</div>');
}

/* ---------- form transaksi ---------- */
function chips(el,items,sel,pick){
  el.innerHTML=items.map(i=>`<button class="chip${i===sel?' on':''}" data-v="${esc(i)}">${esc(i)}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('.chip');if(b)pick(b.dataset.v)};
}
function drawChips(){
  const names=kOrder(T()),tr=F.tipe==='transfer';
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===F.tipe));
  $('#lblK').textContent=tr?'Dari kantong':F.tipe==='masuk'?'Masuk ke kantong':'Bayar pakai';
  $('#rowT').hidden=!tr;$('#rowC').hidden=tr;
  chips($('#chK'),names,F.kantong,v=>{F.kantong=v;if(F.tujuan===v)F.tujuan='';drawChips()});
  if(tr)chips($('#chT'),names.filter(n=>n!==F.kantong),F.tujuan,v=>{F.tujuan=v;drawChips()});
  else chips($('#chC'),S.kategori.filter(c=>c.tipe===F.tipe).map(c=>c.nama),F.kategori,v=>{F.kategori=v;F.catManual=true;drawChips()});
}
function defaultCat(tipe){return tipe==='masuk'?'Pemasukan lain':'Lain-lain'}
function guess(text,tipe){
  const t=String(text).toLowerCase();let best=null;
  for(const r of S.aturan){
    const k=String(r.kata).toLowerCase().trim();if(!k)continue;
    const c=S.kategori.find(x=>x.nama===r.kategori);if(!c||c.tipe!==tipe)continue;
    if(t.includes(k)&&(!best||k.length>best.k.length))best={k,c:r.kategori};
  }
  return best?best.c:defaultCat(tipe);
}
function openSheet(tx,mic){
  const names=kOrder(T());
  F=tx?{...tx,nominal:+tx.nominal,catManual:true}
      :{id:'',tipe:'keluar',nominal:0,kantong:names[0]||'',tujuan:'',kategori:defaultCat('keluar'),catatan:'',tanggal:todayStr(),catManual:false};
  $('#shTitle').textContent=tx?'Edit transaksi':'Catat';
  $('#nom').value=F.nominal?F.nominal.toLocaleString('id-ID'):'';
  $('#cat').value=F.catatan||'';$('#tgl').value=F.tanggal;
  $('#heard').textContent='';$('#del').hidden=!tx;
  $('#sheet').hidden=false;drawChips();
  if(mic)listen();else if(!tx)setTimeout(()=>$('#nom').focus(),50);
}
function closeSheet(){$('#sheet').hidden=true}
function saveTx(){
  F.catatan=$('#cat').value.trim();F.tanggal=$('#tgl').value||todayStr();
  if(!F.nominal)return toast('Isi nominal dulu');
  if(!F.kantong)return toast('Pilih kantong');
  if(F.tipe==='transfer'){
    if(!F.tujuan)return toast('Pilih kantong tujuan');
    if(F.tujuan===F.kantong)return toast('Kantong asal dan tujuan sama');
    F.kategori='Transfer';
  }else F.tujuan='';
  const tx={id:F.id||(Date.now().toString(36)+Math.random().toString(36).slice(2,6)),tanggal:F.tanggal,tipe:F.tipe,nominal:F.nominal,kantong:F.kantong,tujuan:F.tujuan,kategori:F.kategori,catatan:F.catatan,oleh:F.oleh||cfg.nama||''};
  enqueue({action:F.id?'update':'add',tx});
  closeSheet();toast('Tersimpan');
}

/* ---------- suara ---------- */
const AL={dompet:['dompet','cash','tunai'],seabank:['seabank','sea bank'],gopay:['gopay','go pay'],shopeepay:['shopeepay','shopee pay'],bca:['bca'],bsi:['bsi'],dana:['dana']};
function findK(low){
  const hits=[];
  S.kantong.forEach(k=>{
    const n=k.nama.toLowerCase();
    for(const a of new Set((AL[n]||[]).concat(n))){
      const m=new RegExp('(^|\\W)('+a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?=\\W|$)').exec(low);
      if(m){hits.push({i:m.index+m[1].length,n:k.nama,a});break}
    }
  });
  return hits.sort((x,y)=>x.i-y.i);
}
function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return toast('Browser ini tidak mendukung input suara');
  const r=new SR();r.lang='id-ID';r.interimResults=false;r.maxAlternatives=1;
  $('#mic').classList.add('rec');$('#heard').textContent='Mendengarkan…';
  r.onresult=e=>{const t=e.results[0][0].transcript;$('#heard').textContent='“'+t+'”';fromVoice(t)};
  r.onerror=e=>{$('#heard').textContent='Gagal: '+e.error};
  r.onend=()=>$('#mic').classList.remove('rec');
  try{r.start()}catch{}
}
function fromVoice(t){
  const low=t.toLowerCase(),amt=parseAmount(low);
  let tipe='keluar';
  if(/\b(transfer|pindah)\b/.test(low))tipe='transfer';
  else if(/\b(gaji|terima|dapat|pemasukan|bonus|masuk|komisi|thr)\b/.test(low))tipe='masuk';
  const hits=findK(low);
  F.tipe=tipe;
  if(amt){F.nominal=amt;$('#nom').value=amt.toLocaleString('id-ID')}
  else $('#heard').textContent+='  (nominal tidak terdengar)';
  if(tipe==='transfer'){
    let a=hits[0],b=hits[1];
    const iKe=low.search(/\bke\b/),iDari=low.search(/\bdari\b/);
    if(a&&b&&iKe>=0&&iDari>=0&&iKe<iDari){[a,b]=[b,a]}
    if(a)F.kantong=a.n;if(b)F.tujuan=b.n;
  }else if(hits[0])F.kantong=hits[0].n;
  // catatan: buang nominal dan nama kantong
  let c=t;
  hits.forEach(h=>{c=c.replace(new RegExp('\\b(pakai|pake|dengan|via|dari|ke)?\\s*'+h.a.replace(/\s+/g,'\\s*')+'\\b','i'),' ')});
  c=c.replace(/rp\.?\s*[\d.,]+/gi,' ').replace(/[\d.,]+\s*(ribu|rb|k|juta|jt)?/gi,' ')
     .replace(/\b(nol|satu|dua|tiga|empat|lima|enam|tujuh|delapan|sembilan|sepuluh|sebelas|belas|puluh|ratus|ribu|juta|seribu|seratus|sejuta|rupiah)\b/gi,' ')
     .replace(/\s+/g,' ').trim();
  if(tipe==='transfer')c=c.replace(/^(transfer|pindah)\s*/i,'').trim();
  c=c?c[0].toUpperCase()+c.slice(1):'';
  $('#cat').value=c;F.catatan=c;
  if(tipe!=='transfer'){F.kategori=guess(c||t,tipe);F.catManual=false}
  drawChips();
}

/* ---------- pengaturan ---------- */
function openSet(){$('#sUrl').value=cfg.url||'';$('#sPin').value=cfg.pin||'';$('#sNama').value=cfg.nama||'';$('#set').hidden=false}
function saveSet(){
  cfg={url:$('#sUrl').value.trim(),pin:$('#sPin').value.trim(),nama:$('#sNama').value.trim()};
  jset('cfg',cfg);$('#set').hidden=true;load();flush();
}

/* ---------- event ---------- */
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.v==='set')return openSet();view=b.dataset.v;render()};
$('#fabAdd').onclick=()=>openSheet(null,false);
$('#fabMic').onclick=()=>openSheet(null,true);
$('#shX').onclick=closeSheet;$('#setX').onclick=()=>$('#set').hidden=true;
$('#mic').onclick=listen;
$('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;F.tipe=b.dataset.t;
  if(F.tipe==='transfer'){F.tujuan=F.tujuan===F.kantong?'':F.tujuan}
  else if(!F.catManual||!S.kategori.find(c=>c.nama===F.kategori&&c.tipe===F.tipe)){F.kategori=guess($('#cat').value,F.tipe);F.catManual=false}
  drawChips()};
$('#nom').oninput=e=>{const d=e.target.value.replace(/\D/g,'');F.nominal=+d||0;e.target.value=d?(+d).toLocaleString('id-ID'):''};
$('#cat').oninput=e=>{if(!F.catManual&&F.tipe!=='transfer'){F.kategori=guess(e.target.value,F.tipe);drawChips()}};
$('#save').onclick=saveTx;
$('#del').onclick=()=>{if(confirm('Hapus transaksi ini?')){enqueue({action:'delete',id:F.id});closeSheet();toast('Dihapus')}};
$('#sSave').onclick=saveSet;
$('#sLink').onclick=async()=>{
  if(!cfg.url)return toast('Simpan URL dan PIN dulu');
  const link=location.origin+location.pathname+'#c='+btoa(JSON.stringify({u:cfg.url,p:cfg.pin}));
  try{await navigator.clipboard.writeText(link);toast('Link disalin, kirim ke istri')}catch{prompt('Salin link ini:',link)}
};
$('#app').onclick=e=>{
  const mb=e.target.closest('[data-m]');if(mb){month=shiftMonth(month,+mb.dataset.m);return render()}
  const it=e.target.closest('.item');if(it){const t=T().find(x=>x.id===it.dataset.id);if(t)openSheet(t,false)}
};
window.addEventListener('online',flush);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){flush();load()}});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
if(!cfg.nama&&cfg.url)openSet();
load();flush();
</script>
